version: '3'
silent: true

vars:
  # Build-Version im Format vYYMMDDhhmm, per ldflags in main.version injiziert.
  QDROVER_VERSION:
    sh: date +v%y%m%d%H%M

tasks:
  default:
    desc: Alias für install
    cmds:
      - task: install

  install:
    desc: Passendes Binary für diese Plattform nach ~/bin/qdrover und den Skill nach ~/.claude/skills installieren
    deps: [dist-build]
    vars:
      BINARY: dist/qdrover_{{OS}}_{{ARCH}}
    preconditions:
      - sh: test -f {{.BINARY}}
        msg: "Kein Build für {{OS}}/{{ARCH}} — dist-build baut nur linux/amd64 und darwin/arm64"
    cmds:
      - mkdir -p $HOME/bin
      # erst löschen: cp über ein laufendes/signiertes Binary lässt macOS es per SIGKILL beenden
      - rm -f $HOME/bin/qdrover
      - cp {{.BINARY}} $HOME/bin/qdrover
      - mkdir -p $HOME/.claude/skills/qdrover-roadmap
      - cp skills/qdrover-roadmap/SKILL.md $HOME/.claude/skills/qdrover-roadmap/SKILL.md

  dist-build:
    desc: Cross-Builds nach dist/ (Linux amd64, macOS arm64) — nicht installiert
    cmds:
      - mkdir -p dist
      - GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version={{.QDROVER_VERSION}}" -o dist/qdrover_linux_amd64 ./cmd/qdrover
      - GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.version={{.QDROVER_VERSION}}" -o dist/qdrover_darwin_arm64 ./cmd/qdrover

  release:
    desc: GitHub Release mit den dist/-Binaries erstellen (gh CLI muss installiert & angemeldet sein)
    deps: [dist-build]
    cmds:
      - gh release create {{.QDROVER_VERSION}} dist/qdrover_linux_amd64 dist/qdrover_darwin_arm64 --title "{{.QDROVER_VERSION}}" --generate-notes

  screenshot:
    desc: README-Screenshot img/snapshot1.png per vhs aus den Demo-Daten in img/demo/ neu erzeugen
    preconditions:
      - sh: command -v vhs
        msg: "vhs fehlt — installieren mit: brew install vhs"
    cmds:
      - rm -rf .demo
      - mkdir -p .demo/home/.local/state/qdrover .demo/project
      - cp img/demo/global.json .demo/home/.local/state/qdrover/global.json
      - cp img/demo/qdrover.json .demo/project/qdrover.json
      - go build -ldflags "-X main.version={{.QDROVER_VERSION}}" -o .demo/qdrover ./cmd/qdrover
      # vhs überschreibt ein vorhandenes Bild stillschweigend nicht
      - rm -f img/snapshot1.png
      - vhs img/snapshot.tape

  test:
    desc: Alle Tests ausführen
    cmds:
      - go test ./...

  lint:
    desc: golangci-lint über das gesamte Modul laufen lassen
    cmds:
      - golangci-lint run

  run:
    desc: TUI direkt starten (go run)
    cmds:
      - go run ./cmd/qdrover
